name: 가위바위보 배틀 설치 파일 만들기

on:
  push:
    branches: ["**"]
    paths:
      - "games/rps-battle/**"
      - ".github/workflows/build-rps-battle.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: games/rps-battle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/rps-battle/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: rps-battle-windows-setup
          path: games/rps-battle/dist/*.exe
          if-no-files-found: error
